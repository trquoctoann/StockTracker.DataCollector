[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stocktracker-datacollector"
version = "0.1.0"
description = "Microservice DataCollector — ETL pipeline cho StockTracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aio-pika",
    "alembic",
    "apscheduler",
    "asyncpg",
    "boto3",
    "fastapi",
    "httpx",
    "pandas",
    "pydantic",
    "pydantic-settings",
    "structlog",
    "tenacity",
    "uvicorn[standard]",
    "vnstock==4.0.7",
]

[dependency-groups]
dev = [
    "pyright>=1.1.409",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
exclude = [".venv"]
pythonVersion = "3.12"
typeCheckingMode = "basic"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
